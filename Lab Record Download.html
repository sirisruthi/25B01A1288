r the DFS traversal.</li></ul><p><br></p><p><strong>Output Format:</strong></p><ul><li>Print the DFS traversal of the graph starting from $S$, with vertices separated by a space.</li></ul><p><br></p><p><strong>Note:</strong></p><ul><li>If multiple nodes are available to visit, DFS should proceed in the order of their appearance in the adjacency matrix.</li></ul>"}}, "67bc3498a328f2493532fe17": {"id": "67bc3498a328f2493532fe17", "src": "1507_ct_ch", "isEnabled": true, "useCustomTitle": false, "modifiedQTitle": "", "useCustomText": false, "modifiedQText": "", "extraInfo": {"displayText": "Breadth First Search (BFS) on a Graph", "questionText": "<p>Write a program to perform Breadth First Search (BFS) traversal on an undirected graph using an adjacency matrix representation. The program should take the number of vertices, edges, and the starting vertex as input and print the BFS traversal of the graph.</p><p><br></p><p><strong>Input Format:</strong></p><ul><li>The first line contains an integer $N$, representing the number of vertices in the graph.</li><li>The second line contains an integer $E$, representing the number of edges in the graph.</li><li>The next $E$ lines contain two space-separated integers $v_1$, $v_2$ representing an edge between vertices $v_1$ and $v_2$.</li><li>The last line contains an integer $S$, representing the starting vertex for the BFS traversal.</li></ul><p><br></p><p><strong>Output Format:</strong></p><ul><li>Print the BFS traversal of the graph starting from $S$, with vertices separated by a space. If a vertex has multiple neighbors, process them in increasing order.</li></ul>"}}, "6874993ff8c8c5784b3d662e": {"id": "6874993ff8c8c5784b3d662e", "src": "1507_ct_ch", "isEnabled": true, "useCustomTitle": false, "modifiedQTitle": "", "useCustomText": false, "modifiedQText": "", "extraInfo": {"displayText": "Depth-First Search (DFS)", "questionText": "<p>Write a C program to implement and perform a Depth-First Search (DFS) on a directed graph represented using an adjacency list. The program should print all the nodes reachable from a given starting node.</p><p><br></p><p><strong>Input Format:</strong></p><ul><li>The first line contains two integers: $V$ (number of vertices) and $E$ (number of edges).</li><li>The next $E$ lines each contain two integers: $u$ and $v$, where there is a directed edge from node $u$ to node $v$.</li><li>The last line contains the starting node for the DFS traversal.</li></ul><p><br></p><p><strong>Output Format:</strong></p><ul><li>Print all reachable nodes from the starting node in the order they are visited by DFS as a single line of space-separated integers.</li></ul><p><br></p><p><strong>\ufeffNote: </strong></p><ul><li>In DFS, the smaller numbered node is visited first when there are multiple adjacent nodes, ensuring a consistent traversal order</li><li>Refer to the visible test cases for a better understanding.</li></ul>"}}, "6874a2f8f8c8c5784b3d82a3": {"id": "6874a2f8f8c8c5784b3d82a3", "src": "1507_ct_ch", "isEnabled": true, "useCustomTitle": false, "modifiedQTitle": "", "useCustomText": false, "modifiedQText": "", "extraInfo": {"displayText": " Breadth First Search (BFS)", "questionText": "<p>Write a C program to perform BFS on a directed graph using adjacency lists. The graph has $V$ vertices and $E$ edges. After building the graph, sort each vertex’s adjacency list in ascending order. Then perform BFS from a given starting node and print all reachable nodes in the order they are visited as space-separated integers. When multiple adjacent nodes are available, always visit the smallest one first.</p><p><br></p><p><strong>Input Format:</strong></p><ul><li>The input begins with a line containing two integers $V$ and $E$, where $V$ is the number of vertices and $E$ is the number of edges in the directed graph.</li><li>The following $E$ lines each contain two integers $u$ and $v$, indicating a directed edge from vertex $u$ to vertex $v$.</li><li>The final line contains a single integer $start$, which represents the starting vertex for the BFS traversal.</li></ul><p><br></p><p><strong>Output Format:</strong></p><ul><li>Print all reachable nodes from the starting vertex in the order they are visited by BFS, as a single line of space-separated integers.</li></ul><p><br></p><p><strong>Note: </strong>Refer to the test cases for better understanding.</p>"}}, "686e2d09c1484d4f07195e8f": {"id": "686e2d09c1484d4f07195e8f", "src": "1507_ct_ch", "isEnabled": true, "useCustomTitle": false, "modifiedQTitle": "", "useCustomText": false, "modifiedQText": "", "extraInfo": {"displayText": "Bi-Connected Components in Graph", "questionText": "<p>Write a C program for finding the count of bi-connected components in a given graph</p><p><br></p><p><strong>Input Format:</strong></p><ul><li>First line in the input indicates the number of vertices.</li><li>Second line in the input indicates the number of edges.</li><li>The next following lines indicates the edges, which takes two vertices $u$ $v$ as space separated integers for each edge.</li></ul><p><br></p><p><strong>Output Format:</strong></p><ul><li>The code will print the number of biconnected components found in the graph.</li></ul><p><br></p><p><strong>Note: </strong>Refer to the test cases for better understanding.</p>"}}, "686e2d9dc1484d4f07196044": {"id": "686e2d9dc1484d4f07196044", "src": "1507_ct_ch", "isEnabled": true, "useCustomTitle": false, "modifiedQTitle": "", "useCustomText": false, "modifiedQText": "", "extraInfo": {"displayText": "C program that implements the quick sort", "questionText": "<p>Write a C program that implements the quick sort to sort a given list of integers in ascending order.</p><p><br></p><p><strong>Input Format</strong></p><ul><li>The first line contains an integer $n$ which represents the number of elements in the array.</li><li>The second line contains $n$ space-separated integers, which are the elements of the array.</li></ul><p><br></p><p><strong>Output Format</strong></p><ul><li>A single line containing $n$ space-separated integers, representing the array elements in ascending order after sorting.</li></ul><p><br></p><p><strong>Note:&nbsp;</strong>Refer to the test cases for better understanding.</p>"}}, "686e30fdc1484d4f071968c9": {"id": "686e30fdc1484d4f071968c9", "src": "1507_ct_ch", "isEnabled": true, "useCustomTitle": false, "modifiedQTitle": "", "useCustomText": false, "modifiedQText": "", "extraInfo": {"displayText": "C program that implements the merge sort", "questionText": "<p>Write a C program to implement the Merge Sort algorithm to sort an array of integers in ascending order.</p><p><br></p><p><strong>Input Format</strong></p><ul><li>The first line contains an integer $n$ which represents the number of elements in the array.</li><li>The second line contains $n$ space-separated integers, which are the elements of the array.</li></ul><p><br></p><p><strong>Output Format</strong></p><ul><li>A single line containing $n$ space-separated integers, representing the array elements in ascending order after sorting.</li></ul><p><br></p><p><br></p><p><strong>Note: </strong>Refer to the test cases for better understanding.</p>"}}, "686e372ec1484d4f07197845": {"id": "686e372ec1484d4f07197845", "src": "1507_ct_ch", "isEnabled": true, "useCustomTitle": false, "modifiedQTitle": "", "useCustomText": false, "modifiedQText": "", "extraInfo": {"displayText": "Shortest Path from Source to Vertex", "questionText": "<p>You are required to write a C program that computes the shortest paths from a source vertex to all other vertices in a weighted, directed graph. The program should utilize Dijkstra's algorithm to solve this problem.</p><p><br></p><p><strong>Input Format:</strong></p><ul><li>The first line contains two integers $V$ and $E$, representing the number of vertices and the number of edges respectively.</li><li>The next $E$ lines each contain three integers $u$, $v$, and $w$, representing a directed edge from vertex $u$ to vertex $v$ with weight $w$.</li><li>The last line contains a single integer $src$, representing the source vertex from which shortest distances are to be calculated.</li></ul><p><br></p><p><strong>Output Format:</strong></p><ul><li>The output consists of $V$ lines.</li><li>Each line contains two integers:</li><li class=\"ql-indent-1\">The vertex number and the minimum distance from the source vertex to that vertex, space separated</li></ul><p><br></p><p><strong>Note: </strong>Refer to the test cases for better understanding.</p>"}}, "686e3b66c1484d4f071980f0": {"id": "686e3b66c1484d4f071980f0", "src": "1507_ct_ch", "isEnabled": true, "useCustomTitle": false, "modifiedQTitle": "", "useCustomText": false, "modifiedQText": "", "extraInfo": {"displayText": "Job Sequencing using Greedy Problem", "questionText": "<p><span style=\"background-color: var(--background); color: var(--text-color);\">Given a set of&nbsp;$N$&nbsp;jobs, where each&nbsp;job</span><strong style=\"background-color: var(--background); color: var(--text-color);\"> </strong><span style=\"background-color: var(--background); color: var(--text-color);\">$i$&nbsp;has a deadline and a profit associated with it. Each job takes&nbsp;1&nbsp;unit of time to complete, and only one job can be scheduled at a time. We earn the profit associated with the job if and only if the job is completed by its deadline. Find the number of jobs done and the&nbsp;maximum profit.</span></p><p><br></p><p><strong style=\"background-color: var(--background); color: var(--text-color);\">Note:&nbsp;</strong><span style=\"background-color: var(--background); color: var(--text-color);\">Jobs will be given in the form (Job Id, Deadline, Profit) associated with that Job. The deadline of the job is the time by which the job needs to be completed to earn the profit.</span></p><p><br></p><p><strong>Input Format:</strong></p><ul><li>The first line contains an integer $N$ representing the number of jobs.</li><li>The next $N$ lines each contain three space-separated integers: {Job ID, Job Deadline, Job Profit} — representing one job per line.</li></ul><p><br></p><p><strong>Output Format</strong></p><ul><li>Two integers separated by a space:</li><li>The first integer represents the number of jobs done.The second integer represents the maximum profit obtained.</li></ul><p><br></p><p><strong style=\"color: var(--text-color); background-color: var(--background);\">Constraints:</strong></p><ul><li>$1\\le N\\le10^5$</li><li>$1\\le Deadline\\le N$</li><li>$1\\le Profit\\le500$</li></ul><p><br></p><p><strong style=\"background-color: var(--background); color: var(--text-color);\">Example 1:</strong></p><p><strong>Input: </strong></p><pre class=\"ql-syntax\" spellcheck=\"false\">4\n1 4 20 \n2 1 10 \n3 1 40 \n4 1 30\n</pre><p><strong>Output: </strong></p><pre class=\"ql-syntax\" spellcheck=\"false\">2 60\n</pre><p><strong>Explanation:</strong> Job 1&nbsp;and Job 3 can be done with a maximum profit of 60 (20+40).</p><p><br></p><p><strong>Note:</strong> Refer to the test cases for better understanding.</p>"}}, "686e3d4ec1484d4f07198562": {"id": "686e3d4ec1484d4f07198562", "src": "1507_ct_ch", "isEnabled": true, "useCustomTitle": false, "modifiedQTitle": "", "useCustomText": false, "modifiedQText": "", "extraInfo": {"displayText": "Program to implement Knapsack problem Using Dynamic Programming", "questionText": "<p>You are given $n$ items, each with a specific weight and value. You have a knapsack with a maximum capacity $W$. Your goal is to select a subset of these items such that the total weight is less than or equal to $W$, and the total value is as large as possible.</p><p><br></p><p>This is the classic 0/1 Knapsack problem, where each item can either be included once or excluded from the knapsack.</p><p><br></p><p><strong>Input Format:</strong></p><ul><li>The first line contains an integer $n$, representing the number of items to consider for the knapsack.</li><li>The second line contains $n$ space-separated integers, representing the weights of the items.</li><li>The third line contains $n$ space-separated integers, representing the values of the items, corresponding to their weights.</li><li>The fourth line contains an integer $W$, representing the capacity of the knapsack.</li></ul><p><br></p><p><strong>Output Format:</strong></p><ul><li>Print the maximum profit that can be obtained by selecting items such that their combined weight does not exceed the knapsack capacity.</li></ul><p><br></p><p><strong>Note: </strong>Refer to the test cases for better understanding.</p><p><br></p>"}}, "6874a7c8f8c8c5784b3d93a7": {"id": "6874a7c8f8c8c5784b3d93a7", "src": "1507_ct_ch", "isEnabled": true, "useCustomTitle": false, "modifiedQTitle": "", "useCustomText": false, "modifiedQText": "", "extraInfo": {"displayText": "N-Queens Problem", "questionText": "<p>Write a C program to solve the N-Queens problem using backtracking. The goal is to place $N$ queens on an $N \\times N$ chessboard such that no two queens attack each other. A queen can attack another queen if they share the same row, column, or diagonal. Your program should print the first valid configuration of the board found by placing queens from left to right and top to bottom, using a backtracking approach. The board must be displayed as an $N \\times N$ matrix where a cell contains 1 if a queen is placed there, and 0 otherwise. If no solution exists for the given value of $N$, print a message indicating that no solution exists.</p><p><br></p><p><strong>Input Format:</strong></p><ul><li>A single integer $N$ — the number of queens and the size of the chessboard.</li></ul><p><br></p><p><strong>Output Format:</strong></p><ul><li>If a solution exists, print an $N × N$ matrix consisting of 0s and 1s, where 1 represents a queen.</li><li>If no solution exists, print: \"No solution exists for N = &lt;value&gt;\".</li><li>Each row of the matrix should be printed on a new line, with space-separated values.</li></ul><p><br></p><p><strong>Note:</strong> Refer to the test cases for better understanding.</p>"}}, "686e3e4cc1484d4f071987cb": {"id": "686e3e4cc1484d4f071987cb", "src": "1507_ct_ch", "isEnabled": true, "useCustomTitle": false, "modifiedQTitle": "", "useCustomText": false, "modifiedQText": "", "extraInfo": {"displayText": "Knapsack using backtracking", "questionText": "<p>Write a C program to solve the 0/1 Knapsack Problem using backtracking approach. The program aims to maximize the total value of items that can be included in a knapsack without exceeding its capacity</p><p><br></p><p><strong>Input Format:</strong></p><ul><li>The first line contains an integer $n$, representing the number of items.</li><li>The next $n$ lines each contain two space-separated integers: the value and weight of an item.</li><li>The last line contains an integer $W$, representing the capacity of the knapsack.</li></ul><p><br></p><p><strong>Output Format:</strong></p><ul><li>Print the maximum profit (total value) that can be obtained by selecting items, considering the knapsack's capacity constraint.</li></ul><p><br></p><p><strong>Note:</strong> Refer to the test cases for better understanding.</p>"}}, "663b77868f90bb589457fbed": {"id": "663b77868f90bb589457fbed", "src": "1507_ct_ch", "isEnabled": true, "useCustomTitle": false, "modifiedQTitle": "", "useCustomText": false, "modifiedQText": "", "extraInfo": {"displayText": "Travelling Salesman Problem", "questionText": "<p>Given a set of cities and the distance between every pair of cities, the problem is to find the shortest possible route that visits every city exactly once and returns to the starting point.</p><p><br></p><p><strong>Example:</strong></p><p><strong><img src=\"https://ct-public-bucket.s3.ap-south-1.amazonaws.com/dmi/image/1507/q-62bae673993774078fda6ee0/5b315d05-cf0c-9f08-a058-6f3b3d29ae5a/71f814c5-2a11-ba16-be1e-3c4e88977575.png\"></strong></p><p><br></p><p>A TSP tour in the graph is 1-2-4-3-1. The cost of the tour is 10+25+30+15, which is 80</p><p><br></p><p><strong>Input Format:</strong></p><ul><li>The first line contains an integer<strong> </strong>$n$, representing the number of cities.</li><li>The following<strong> </strong>$n$ lines contain the cost matrix of size<strong> </strong>$n \\times n$. Each line contains $n$<strong> </strong>integers separated by spaces, representing the cost of traveling from one city to another. If there is no direct connection between two cities, -1 is used to represent infinity.</li></ul><p><br></p><p><strong>Output Format:</strong></p><ul><li>The output is a single integer representing the optimal cost of the traveling salesman problem.</li></ul>"}}}, "qidVsSolution": {"686e4275c1484d4f071994c9": {"_id": {"$oid": "6a7aeddf906b8d6a35cdd7a6"}, "question": "686e4275c1484d4f071994c9", "userId": "68e4d543f63c7c5818f9ace8", "endUserCourse": "6a5f3cda7bf2784be70f1a64", "activity": {"04-08-2026": {"t": 534}, "11-08-2026": {"t": 2780, "ncf": 14, "ns": 15, "tnce": 56, "nef": 0, "ttc": 4, "ftc": 0}}, "answerReviewRequired": false, "averageTime": 92.5, "cExecutionResultsTimings": [186, 181, 170, 183], "createdBy": "25b01a1288@svecw.edu.in", "createdTime": {"$date": "2026-08-11T09:39:43.223Z"}, "endUserCourseUnit": "6a5f3cda7bf2784be70f1a65", "endUserSubUnit": "6a5f3cda7bf2784be70f1a66", "hintsUsed": 0, "maxTime": 98.0, "parentId": "686e4275c1484d4f071994c9", "questionNo": "72992", "solution": {"filesContentArr": [{"fileContent": "// write your code here..//Btree\n#include &lt;stdio.h&gt;\n#include &lt;stdlib.h&gt;\n#include &lt;stdbool.h&gt;\ntypedef struct BTreeNode {\nint *keys;\nint t;\nstruct BTreeNode **C;\nint n;\nbool leaf;\n} BTreeNode;\nBTreeNode* createNode(int t, bool leaf) {\nBTreeNode* node = (BTreeNode*)malloc(sizeof(BTreeNode));\nnode-&gt;t = t;\nnode-&gt;leaf = leaf;\nnode-&gt;keys = (int*)malloc((2 * t - 1) * sizeof(int));\nnode-&gt;C = (BTreeNode**)malloc((2 * t) * sizeof(BTreeNode*));\nnode-&gt;n = 0;\nreturn node;}\nvoid inorder(BTreeNode* root) {\nif (!root) return;\nfor (int i = 0; i &lt; root-&gt;n; i++) {\nif (!root-&gt;leaf)\ninorder(root-&gt;C[i]);\nprintf(\"%d \", root-&gt;keys[i]);}\nif (!root-&gt;leaf)\ninorder(root-&gt;C[root-&gt;n]);}\nbool search(BTreeNode* root, int k) {\nint i = 0;\nwhile (i &lt; root-&gt;n &amp&amp k &gt; root-&gt;keys[i])\ni++;\nif (i &lt; root-&gt;n &amp&amp root-&gt;keys[i] == k)\nreturn true;\nif (root-&gt;leaf)\nreturn false;\nreturn search(root-&gt;C[i], k);}\nvoid splitChild(BTreeNode* x, int i) {\nint t = x-&gt;t;\nBTreeNode* y = x-&gt;C[i];\nBTreeNode* z = createNode(t, y-&gt;leaf);\nz-&gt;n = t - 1;\nfor (int j = 0; j &lt; t - 1; j++)\nz-&gt;keys[j] = y-&gt;keys[j + t];\nif (!y-&gt;leaf) {\nfor (int j = 0; j &lt; t; j++)\nz-&gt;C[j] = y-&gt;C[j + t];}\ny-&gt;n = t - 1;\nfor (int j = x-&gt;n; j &gt;= i + 1; j--)\nx-&gt;C[j + 1] = x-&gt;C[j];\nx-&gt;C[i + 1] = z;\nfor (int j = x-&gt;n - 1; j &gt;= i; j--)\nx-&gt;keys[j + 1] = x-&gt;keys[j];\nx-&gt;keys[i] = y-&gt;keys[t - 1];\nx-&gt;n++;}\nvoid insertNonFull(BTreeNode* x, int k) {\nint i = x-&gt;n - 1;\nif (x-&gt;leaf) {\nwhile (i &gt;= 0 &amp&amp k &lt; x-&gt;keys[i]) {\nx-&gt;keys[i + 1] = x-&gt;keys[i];\ni--;}\nx-&gt;keys[i + 1] = k;\nx-&gt;n++;\n} else {\nwhile (i &gt;= 0 &amp&amp k &lt; x-&gt;keys[i])\ni--;\ni++;\nif (x-&gt;C[i]-&gt;n == 2 * x-&gt;t - 1) {\nsplitChild(x, i);\nif (k &gt; x-&gt;keys[i])\ni++;}\ninsertNonFull(x-&gt;C[i], k);}}\nvoid insert(BTreeNode** rootRef, int k) {\nBTreeNode* r = *rootRef;\nif (r-&gt;n == 2 * r-&gt;t - 1) {\nBTreeNode* s = createNode(r-&gt;t, false);\ns-&gt;C[0] = r;\nsplitChild(s, 0);\nint i = (k &gt; s-&gt;keys[0]) ? 1 : 0;\ninsertNonFull(s-&gt;C[i], k);\n*rootRef = s;\n} else {\ninsertNonFull(r, k);}}\nint getPred(BTreeNode* x) {\nwhile (!x-&gt;leaf)\nx = x-&gt;C[x-&gt;n];\nreturn x-&gt;keys[x-&gt;n - 1];}\nint getSucc(BTreeNode* x) {\nwhile (!x-&gt;leaf)\nx = x-&gt;C[0];\nreturn x-&gt;keys[0];}\n// Merge two children\nvoid merge(BTreeNode* x, int idx) {\nBTreeNode* c1 = x-&gt;C[idx];\nBTreeNode* c2 = x-&gt;C[idx + 1];\nint t = x-&gt;t;\nc1-&gt;keys[t - 1] = x-&gt;keys[idx];\nfor (int i = 0; i &lt; c2-&gt;n; ++i)\nc1-&gt;keys[i + t] = c2-&gt;keys[i];\nif (!c1-&gt;leaf) {\nfor (int i = 0; i &lt;= c2-&gt;n; ++i)\nc1-&gt;C[i + t] = c2-&gt;C[i];}\nfor (int i = idx + 1; i &lt; x-&gt;n; ++i)\nx-&gt;keys[i - 1] = x-&gt;keys[i];\nfor (int i = idx + 2; i &lt;= x-&gt;n; ++i)\nx-&gt;C[i - 1] = x-&gt;C[i];\nc1-&gt;n += c2-&gt;n + 1;\nx-&gt;n--;\nfree(c2);}\n// Fill child if less than t-1 keys\nvoid fill(BTreeNode* x, int idx) {\nint t = x-&gt;t;\nif (idx &gt; 0 &amp&amp x-&gt;C[idx - 1]-&gt;n &gt;= t) {\nBTreeNode* child = x-&gt;C[idx];\nBTreeNode* sibling = x-&gt;C[idx - 1];\nfor (int i = child-&gt;n - 1; i &gt;= 0; --i)\nchild-&gt;keys[i + 1] = child-&gt;keys[i];\nif (!child-&gt;leaf) {\nfor (int i = child-&gt;n; i &gt;= 0; --i)\nchild-&gt;C[i + 1] = child-&gt;C[i];}\nchild-&gt;keys[0] = x-&gt;keys[idx - 1];\nif (!child-&gt;leaf)\nchild-&gt;C[0] = sibling-&gt;C[sibling-&gt;n];\nx-&gt;keys[idx - 1] = sibling-&gt;keys[sibling-&gt;n - 1];\nchild-&gt;n += 1;\nsibling-&gt;n -= 1;\n} else if (idx &lt; x-&gt;n &amp&amp x-&gt;C[idx + 1]-&gt;n &gt;= t) {\nBTreeNode* child = x-&gt;C[idx];\nBTreeNode* sibling = x-&gt;C[idx + 1];\nchild-&gt;keys[child-&gt;n] = x-&gt;keys[idx];\nif (!child-&gt;leaf)\nchild-&gt;C[child-&gt;n + 1] = sibling-&gt;C[0];\nx-&gt;keys[idx] = sibling-&gt;keys[0];\nfor (int i = 1; i &lt; sibling-&gt;n; ++i)\nsibling-&gt;keys[i - 1] = sibling-&gt;keys[i];\nif (!sibling-&gt;leaf) {\nfor (int i = 1; i &lt;= sibling-&gt;n; ++i)\nsibling-&gt;C[i - 1] = sibling-&gt;C[i];}\nchild-&gt;n += 1;\nsibling-&gt;n -= 1;\n} else {\nif (idx != x-&gt;n)\nmerge(x, idx);\nelse\nmerge(x, idx - 1);}}\n// Remove key from tree\nvoid removeFromNode(BTreeNode* x, int k) {\nint idx = 0;\nwhile (idx &lt; x-&gt;n &amp&amp x-&gt;keys[idx] &lt; k)\n++idx;\nif (idx &lt; x-&gt;n &amp&amp x-&gt;keys[idx] == k) {\nif (x-&gt;leaf) {\nfor (int i = idx + 1; i &lt; x-&gt;n; ++i)\nx-&gt;keys[i - 1] = x-&gt;keys[i];\nx-&gt;n--;\n} else {\nif (x-&gt;C[idx]-&gt;n &gt;= x-&gt;t) {\nint pred = getPred(x-&gt;C[idx]);\nx-&gt;keys[idx] = pred;\nremoveFromNode(x-&gt;C[idx], pred);\n} else if (x-&gt;C[idx + 1]-&gt;n &gt;= x-&gt;t) {\nint succ = getSucc(x-&gt;C[idx + 1]);\nx-&gt;keys[idx] = succ;\nremoveFromNode(x-&gt;C[idx + 1], succ);\n} else {\nmerge(x, idx);\nremoveFromNode(x-&gt;C[idx], k);}}} else {\nif (x-&gt;leaf)\nreturn;\nbool flag = (idx == x-&gt;n);\nif (x-&gt;C[idx]-&gt;n &lt; x-&gt;t)\nfill(x, idx);\nif (flag &amp&amp idx &gt; x-&gt;n)\nremoveFromNode(x-&gt;C[idx - 1], k);\nelse\nremoveFromNode(x-&gt;C[idx], k);}}\n// Delete key wrapper\nvoid deleteKey(BTreeNode** rootRef, int k) {\nBTreeNode* r = *rootRef;\nremoveFromNode(r, k);\nif (r-&gt;n == 0) {\nBTreeNode* tmp = r;\nif (r-&gt;leaf)\n*rootRef = NULL;\nelse\n*rootRef = r-&gt;C[0];\nfree(tmp);}}\nint main() {\nint t;\nscanf(\"%d\", &ampt);\nBTreeNode* root = createNode(t, true);\nint n, val;\nscanf(\"%d\", &ampn);\nfor (int i = 0; i &lt; n; i++) {\nscanf(\"%d\", &ampval);\ninsert(&amproot, val);}\ninorder(root);\nint d;\nscanf(\"%d\", &ampd);\nfor (int i = 0; i &lt; d; i++) {\nscanf(\"%d\", &ampval);\ndeleteKey(&amproot, val);}\ninorder(root);\nint target;\nscanf(\"%d\\n\", &amptarget);\nif (search(root, target))\nprintf(\"Found\\n\");\nelse\nprintf(\"Not Found\\n\");\nreturn 0;}", "fileName": "Btreemain.c", "readOnly": false, "readOnlyRanges": null, "fileHidden": false}]}, "timeTaken": 182, "totalTimeSpent": 3314, "updatedBy": "25b01a1288@svecw.edu.in", "updatedTime": {"$date": "2026-10-06T09:32:42.152Z"}}, "686e15cec1484d4f07192701": {"_id": {"$oid": "6a83fd10906b8d6a3544e3b7"}, "userId": "68e4d543f63c7c5818f9ace8", "endUserCourse": "6a5f3cda7bf2784be70f1a64", "question": "686e15cec1484d4f07192701", "activity": {"28-07-2026": {"t": 469}, "04-08-2026": {"t": 3733, "ncf": 2, "ns": 8, "tnce": 5, "ftc": 30, "nef": 6, "ttc": 30}, "11-08-2026": {"t": 21, "ftc": 5, "nef": 1, "ns": 1, "ttc": 5}, "18-08-2026": {"t": 57, "ns": 1, "nef": 0, "ttc": 5, "ftc": 0}}, "answerReviewRequired": false, "averageTime": 238.0, "cExecutionResultsTimings": [11, 10, 26, 31, 18], "createdBy": "25b01a1288@svecw.edu.in", "createdTime": {"$date": "2026-08-18T06:34:56.069Z"}, "endUserCourseUnit": "6a5f3cda7bf2784be70f1a65", "endUserSubUnit": "6a5f3cda7bf2784be70f1a66", "hintsUsed": 0, "maxTime": 353.0, "parentId": "686e15cec1484d4f07192701", "questionNo": "72880", "solution": {"filesContentArr": [{"fileContent": "#include &lt;stdio.h&gt;\n#include &lt;stdlib.h&gt;\ntypedef struct Node {\n    int key;\n    int height;\n    struct Node *left;\n    struct Node *right;\n} Node;\nint max(int a, int b) {\n    return (a &gt; b) ? a : b;}\nint height(Node *node) {\n    if (node == NULL)\n        return 0;\n    return node-&gt;height;\n}\nNode *createNode(int key) {\n    Node *newNode = (Node *)malloc(sizeof(Node));\n    newNode-&gt;key = key;\n    newNode-&gt;height = 1;\n    newNode-&gt;left = NULL;\n    newNode-&gt;right = NULL;\n    return newNode;\n}\nNode *rightRotate(Node *y) {\n    Node *x = y-&gt;left;\n    Node *t2 = x-&gt;right;\n    x-&gt;right = y;\n    y-&gt;left = t2;\n    y-&gt;height = 1 + max(height(y-&gt;left), height(y-&gt;right));\n    x-&gt;height = 1 + max(height(x-&gt;left), height(x-&gt;right));\n    return x;\n}\nNode *leftRotate(Node *x) {\n    Node *y = x-&gt;right;\n    Node *t2 = y-&gt;left;\n    y-&gt;left = x;\n    x-&gt;right = t2;\n    x-&gt;height = 1 + max(height(x-&gt;left), height(x-&gt;right));\n    y-&gt;height = 1 + max(height(y-&gt;left), height(y-&gt;right));\n    return y;\n}\nint getBalance(Node *node) {\n    if (node == NULL)\n        return 0;\n    return height(node-&gt;left) - height(node-&gt;right);\n}\nNode *insert(Node *root, int key) {\n    if (root == NULL)\n        return createNode(key);\n    if (key &lt; root-&gt;key) {\n        root-&gt;left = insert(root-&gt;left, key);\n\t}\n    else if (key &gt; root-&gt;key) {\n        root-&gt;right = insert(root-&gt;right, key);\n\t}\n    else {\n        /* Duplicate element */return root;}\n    root-&gt;height =1 + max(height(root-&gt;left), height(root-&gt;right));\n    int balance = getBalance(root);\n    /* LL Case */ if (balance &gt; 1 &amp&amp key &lt; root-&gt;left-&gt;key)\n        return rightRotate(root);\n    /* RR Case */if (balance &lt; -1 &amp&amp key &gt; root-&gt;right-&gt;key)\n        return leftRotate(root);\n    /* LR Case */if (balance &gt; 1 &amp&amp key &gt; root-&gt;left-&gt;key) {\n        root-&gt;left = leftRotate(root-&gt;left);\n        return rightRotate(root);\n\t}\n    /* RL Case */if (balance &lt; -1 &amp&amp key &lt; root-&gt;right-&gt;key) {\n        root-&gt;right = rightRotate(root-&gt;right);\n        return leftRotate(root);\n\t}\n    return root;\n}\nNode *minValueNode(Node *root) {\n    Node *current = root;\n    while (current != NULL &amp&amp current-&gt;left != NULL)\n        current = current-&gt;left;\n    return current;\n}\nint search(Node *root, int key) {\n    if (root == NULL)\n        return 0;\n    if (key == root-&gt;key)\n        return 1;\n    if (key &lt; root-&gt;key)\n        return search(root-&gt;left, key);\n    return search(root-&gt;right, key);\n}\nNode *deleteNode(Node *root, int key) {\n    if (root == NULL)\n        return NULL;\n    if (key &lt; root-&gt;key) {\n        root-&gt;left = deleteNode(root-&gt;left, key);\n\t}\n    else if (key &gt; root-&gt;key) {\n        root-&gt;right = deleteNode(root-&gt;right, key);\n\t}\n    else {\n        /* No child */if (root-&gt;left == NULL &amp&amp root-&gt;right == NULL) {\n            free(root);\n            return NULL;\n\t\t}\n        /* Only right child */if (root-&gt;left == NULL) {\n            Node *temp = root-&gt;right;\n            free(root);\n            return temp;\n\t\t}\n        /* Only left child */if (root-&gt;right == NULL) {\n            Node *temp = root-&gt;left;\n            free(root);\n            return temp; \n\t\t}\n        /* Two children */Node *temp = minValueNode(root-&gt;right);\n        root-&gt;key = temp-&gt;key;\n        root-&gt;right = deleteNode(root-&gt;right, temp-&gt;key);\n\t}\n    /* Update height */root-&gt;height =1 + max(height(root-&gt;left), height(root-&gt;right));\n    int balance = getBalance(root);\n    /* LL */ if (balance &gt; 1 &amp&amp getBalance(root-&gt;left) &gt;= 0)\n        return rightRotate(root);\n    /* LR */ if (balance &gt; 1 &amp&amp getBalance(root-&gt;left) &lt; 0) {\n        root-&gt;left = leftRotate(root-&gt;left);\n        return rightRotate(root);\n\t}\n    /* RR */if (balance &lt; -1 &amp&amp getBalance(root-&gt;right) &lt;= 0)\n        return leftRotate(root);\n    /* RL */ if (balance &lt; -1 &amp&amp getBalance(root-&gt;right) &gt; 0) {\n        root-&gt;right = rightRotate(root-&gt;right);\n        return leftRotate(root);\n\t}\n    return root;\n}\nvoid inorder(Node *root) {\n    if (root != NULL) {\n        inorder(root-&gt;left);\n        printf(\"%d \", root-&gt;key);\n        inorder(root-&gt;right);\n\t}\n}\nvoid inorderToFile(Node *root, FILE *file) {\n    if (root != NULL) {\n        inorderToFile(root-&gt;left, file);\n        fprintf(file, \"%d \", root-&gt;key);\n        inorderToFile(root-&gt;right, file);\n\t}\n}\nvoid freeTree(Node *root) {\n    if (root != NULL) {\n        freeTree(root-&gt;left);\n        freeTree(root-&gt;right);\n        free(root);\n\t}\n}\nint main() {\n    Node *root = NULL;\n    char inputFileName[100],outputFileName[100];\n    FILE *inputFile,*outputFile;\n    int n, i,value,choice,element;\n    printf(\"Input file name: \");\n    scanf(\"%99s\", inputFileName);\n    inputFile = fopen(inputFileName, \"r\");\n    if (inputFile == NULL) {\n        printf(\"Error opening input file\\n\");\n        return 0;\n\t}\n    if (fscanf(inputFile, \"%d\", &ampn) != 1) {\n        fclose(inputFile);\n        return 0;\n\t}\n/* Read n elements */for (i = 0; i &lt; n; i++) {\n        if (fscanf(inputFile, \
